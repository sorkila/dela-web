<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coming soon · Dela</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dela is coming to the App Store.">
<meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://playdela.com/coming-soon/">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-italic.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/pirata-one-latin.woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script defer src="https://cloud.umami.is/script.js" data-website-id="6dcc31dc-88bf-40f4-b641-b362c6f1867d"></script>
<style>
  body {
    display: grid;
    place-items: center;
    min-height: 100dvh;
    text-align: center;
    padding:
      max(24px, env(safe-area-inset-top, 0px))
      max(24px, env(safe-area-inset-right, 0px))
      max(24px, env(safe-area-inset-bottom, 0px))
      max(24px, env(safe-area-inset-left, 0px));
  }
  main {
    position: relative;
    z-index: 1;
    max-width: 460px;
    animation: fade 0.7s var(--ease) both;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Static held-apart pose of the home figure. Carries the brand's signature
     visual moment to the most-clicked pre-launch page without the animation
     budget. Same layered shadow stack as the home cells. */
  .mini-figure {
    width: 132px;
    height: 132px;
    display: block;
    margin: 0 auto 32px;
    color: var(--paper);
    overflow: visible;
  }
  .mini-top { fill: var(--paper); transform: translate(0, -7px); }
  .mini-bot { fill: var(--mid);   transform: translate(0, 7px); }
  .mini-top, .mini-bot {
    filter:
      drop-shadow(0 2px 3px rgba(0,0,0,0.30))
      drop-shadow(0 12px 24px rgba(0,0,0,0.22));
  }
  .mini-cut { stroke: currentColor; stroke-width: 1; stroke-linecap: round; opacity: 0.4; }

  h1 {
    font-family: 'Pirata One', serif;
    font-weight: 400;
    font-size: clamp(72px, 14vw, 120px);
    line-height: 0.95;
    letter-spacing: 0.005em;
    margin: 0 0 14px;
    color: var(--paper);
    text-rendering: geometricPrecision;
  }
  .tagline {
    font-style: italic;
    color: var(--mid);
    font-size: 16px;
    letter-spacing: 0.015em;
    margin: 0 0 36px;
  }
  .label {
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 12px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
  }
  .label::before, .label::after {
    content: '';
    display: block;
    width: 18px;
    height: 1px;
    background: var(--surface);
  }
  .lead { color: var(--paper); font-size: 17px; line-height: 1.6; margin: 0 0 32px; }

  @media (prefers-reduced-motion: reduce) { main { animation: none; } }
</style>
</head>
<body>
<main>
  <svg class="mini-figure" viewBox="0 0 153 153" aria-hidden="true">
    <g class="mini-top">
      <rect x="0"   y="0"  width="36" height="36" rx="2"/>
      <rect x="39"  y="0"  width="36" height="36" rx="2"/>
      <rect x="78"  y="0"  width="36" height="36" rx="2"/>
      <rect x="117" y="0"  width="36" height="36" rx="2"/>
      <rect x="39"  y="39" width="36" height="36" rx="2"/>
      <rect x="78"  y="39" width="36" height="36" rx="2"/>
    </g>
    <g class="mini-bot">
      <rect x="39"  y="78"  width="36" height="36" rx="2"/>
      <rect x="78"  y="78"  width="36" height="36" rx="2"/>
      <rect x="0"   y="117" width="36" height="36" rx="2"/>
      <rect x="39"  y="117" width="36" height="36" rx="2"/>
      <rect x="78"  y="117" width="36" height="36" rx="2"/>
      <rect x="117" y="117" width="36" height="36" rx="2"/>
    </g>
    <line class="mini-cut" x1="0" y1="76.5" x2="153" y2="76.5"/>
  </svg>
  <h1>dela</h1>
  <p class="tagline">the art of dividing.</p>
  <p class="label">Coming soon</p>
  <p class="lead">Dela is being prepared for App Store submission. Check back soon, or follow along at <a href="https://sorkila.com">sorkila.com</a>.</p>
  <p><a href="/">return home</a></p>
</main>
</body>
</html>
