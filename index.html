<!doctype html>
<html lang="en">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Dela",
  "applicationCategory": "GameApplication",
  "operatingSystem": "iOS 17",
  "description": "A minimalist iOS puzzle game about cutting abstract shapes into two perfectly balanced halves with as few straight lines as possible.",
  "url": "https://playdela.com/",
  "author": { "@type": "Person", "name": "Erik Nielsen", "url": "https://sorkila.com" }
}
</script>
<style>
  /* spotlight glow — biased toward the wordmark on the now-centered hero */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(1100px 660px at 50% 32%, rgba(var(--paper-rgb), 0.045) 0%, transparent 60%),
      radial-gradient(700px 400px at 50% 32%, rgba(var(--paper-rgb), 0.025) 0%, transparent 70%);
    z-index: 0;
  }

  /* staggered entrance */
  .reveal { opacity: 0; transform: translateY(8px); animation: reveal 1.1s var(--ease) forwards; }
  .r1 { animation-delay: 0.05s; }
  .r2 { animation-delay: 0.20s; }
  .r3 { animation-delay: 0.40s; }
  .r4 { animation-delay: 0.65s; }
  .r5 { animation-delay: 1.30s; }
  @keyframes reveal { to { opacity: 1; transform: none; } }

  header.hero { text-align: center; }
  .wordmark {
    font-family: 'Pirata One', serif;
    font-weight: 400;
    font-size: clamp(80px, 17vw, 180px);
    line-height: 0.95;
    letter-spacing: 0.005em;
    margin: 0;
    color: var(--paper);
  }
  .tagline {
    font-style: italic;
    color: var(--mid);
    font-size: clamp(15px, 2.2vw, 18px);
    letter-spacing: 0.01em;
    margin: 14px 0 0;
    text-wrap: balance;
  }

  /* hero figure: 12-cell hourglass polyomino. Drag-to-cut interactive (see <script>). */
  .hero-figure {
    width: min(300px, 64vw);
    aspect-ratio: 1 / 1;
    margin: clamp(40px, 6vw, 64px) auto clamp(28px, 4vw, 40px);
    overflow: visible;
    cursor: ns-resize;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .hero-figure svg { width: 100%; height: 100%; display: block; overflow: visible; }
  /* Group-level fill is inheritable; this lets bot-flip animate on the group
     so its rhythm survives child rebuilds (shape swaps don't desync the color). */
  .hg-top { fill: var(--paper); }
  .hg-bot { fill: var(--paper); }
  .cell { rx: 2; opacity: 0; animation: cell-reveal 0.45s var(--ease) var(--reveal-delay, 0s) forwards; }
  /* per-cell stagger; nth-child applies inside each <g>, so top and bot stagger
     independently and the bottom half follows the top. */
  .hg-top .cell:nth-child(1) { --reveal-delay: 0.30s; }
  .hg-top .cell:nth-child(2) { --reveal-delay: 0.36s; }
  .hg-top .cell:nth-child(3) { --reveal-delay: 0.42s; }
  .hg-top .cell:nth-child(4) { --reveal-delay: 0.48s; }
  .hg-top .cell:nth-child(5) { --reveal-delay: 0.54s; }
  .hg-top .cell:nth-child(6) { --reveal-delay: 0.60s; }
  .hg-bot .cell:nth-child(1) { --reveal-delay: 0.66s; }
  .hg-bot .cell:nth-child(2) { --reveal-delay: 0.72s; }
  .hg-bot .cell:nth-child(3) { --reveal-delay: 0.78s; }
  .hg-bot .cell:nth-child(4) { --reveal-delay: 0.84s; }
  .hg-bot .cell:nth-child(5) { --reveal-delay: 0.90s; }
  .hg-bot .cell:nth-child(6) { --reveal-delay: 0.96s; }
  @keyframes cell-reveal { to { opacity: 1; } }

  /* 11s narrative cycle. animation-delay: -2.75s starts at the cut-drawing moment on first paint
     so the user sees motion immediately rather than 2.5s of static rest. */
  .hg-top { animation: top-drift 11s -2.75s infinite, top-shadow 11s -2.75s infinite; }
  .hg-bot {
    animation:
      bot-drift 11s -2.75s infinite,
      bot-shadow 11s -2.75s infinite,
      bot-flip 11s -2.75s infinite;
  }
  .hg-top, .hg-bot { filter: drop-shadow(0 1px 2px rgba(0,0,0,0.22)); }
  .hg-cut {
    color: var(--paper);
    stroke-dasharray: 200;
    stroke-dashoffset: 200;
    opacity: 0;
    animation: cut-line 11s -2.75s infinite;
  }
  @keyframes top-drift {
    0%   { transform: translate(0, 0);    animation-timing-function: linear; }
    28%  { transform: translate(0, 0);    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    45%  { transform: translate(0, -14px); animation-timing-function: linear; }
    64%  { transform: translate(0, -14px); animation-timing-function: cubic-bezier(0.7, 0, 0.5, 1); }
    73%  { transform: translate(0, 0);    animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); }
    77%  { transform: translate(0, -1.5px); animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); } /* elastic recoil at contact */
    82%  { transform: translate(0, 0);    animation-timing-function: linear; }
    100% { transform: translate(0, 0); }
  }
  @keyframes bot-drift {
    0%   { transform: translate(0, 0);    animation-timing-function: linear; }
    28%  { transform: translate(0, 0);    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    45%  { transform: translate(0, 14px); animation-timing-function: linear; }
    64%  { transform: translate(0, 14px); animation-timing-function: cubic-bezier(0.7, 0, 0.5, 1); }
    73%  { transform: translate(0, 0);   animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); }
    77%  { transform: translate(0, 1.5px); animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1); }
    82%  { transform: translate(0, 0);   animation-timing-function: linear; }
    100% { transform: translate(0, 0); }
  }
  @keyframes top-shadow {
    0%, 28%   { filter: drop-shadow(0 1px 2px rgba(0,0,0,0.22)); }
    45%, 64%  { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.42)); }
    82%, 100% { filter: drop-shadow(0 1px 2px rgba(0,0,0,0.22)); }
  }
  @keyframes bot-shadow {
    0%, 28%   { filter: drop-shadow(0 1px 2px rgba(0,0,0,0.22)); }
    45%, 64%  { filter: drop-shadow(0 6px 10px rgba(0,0,0,0.42)); }
    82%, 100% { filter: drop-shadow(0 1px 2px rgba(0,0,0,0.22)); }
  }
  @keyframes bot-flip {
    /* same color as top before/after; shifts to mid through the separation phase.
       Transition timing aligns with drift: cut + separate (28-36%), held (36-64%),
       rejoin (64-73%), settled (73-100%). */
    0%, 28%   { fill: var(--paper); }
    36%, 64%  { fill: var(--mid); }
    73%, 100% { fill: var(--paper); }
  }
  @keyframes cut-line {
    0%, 22% { stroke-dashoffset: 200; opacity: 0;    animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    28%     { stroke-dashoffset: 0;   opacity: 0.55; animation-timing-function: linear; }
    64%     { stroke-dashoffset: 0;   opacity: 0.55; animation-timing-function: cubic-bezier(0.55, 0, 0.45, 1); }
    73%     { stroke-dashoffset: 0;   opacity: 0;    animation-timing-function: linear; } /* heals as halves meet */
    100%    { stroke-dashoffset: 200; opacity: 0; }
  }

  /* manual mode: JS sets data-mode="manual" while the visitor is dragging.
     Animation is removed so inline transforms on the groups take over.
     Transitions smooth the manual movement and the post-release return. */
  .hero-figure[data-mode="manual"] .hg-top,
  .hero-figure[data-mode="manual"] .hg-bot,
  .hero-figure[data-mode="manual"] .hg-cut {
    animation: none;
    transition:
      transform 0.5s var(--ease),
      opacity 0.35s var(--ease),
      stroke-dashoffset 0.35s var(--ease),
      fill 0.35s var(--ease),
      filter 0.35s var(--ease);
  }

  /* badge */
  .badge-row { display: flex; justify-content: center; }
  .app-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 11px 20px;
    border: 1px solid var(--surface);
    border-radius: 12px;
    color: var(--paper);
    background: linear-gradient(180deg, rgba(var(--paper-rgb), 0.025) 0%, transparent 100%);
    text-decoration: none;
    min-height: 52px;
    line-height: 1.1;
  }
  .app-badge {
    transition:
      border-color 0.5s var(--ease),
      transform 0.5s var(--ease),
      background 0.5s var(--ease);
    will-change: transform;
  }
  @media (hover: hover) {
    .app-badge:hover {
      border-color: var(--mid);
      transform: translateY(-1px);
      background: linear-gradient(180deg, rgba(var(--paper-rgb), 0.05) 0%, transparent 100%);
    }
  }
  .app-badge svg { flex: 0 0 auto; color: var(--paper); }
  .app-badge .top { display: block; font-size: 10px; color: var(--mid); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 1px; }
  .app-badge .bot { display: block; font-size: 17px; font-weight: 500; letter-spacing: 0.005em; }

  .fineprint {
    margin: 18px auto 0;
    font-size: 13px;
    color: var(--mid);
    letter-spacing: 0.04em;
    text-align: center;
    text-wrap: balance;
    max-width: 540px;
  }
  .fineprint .dot { color: var(--muted); margin: 0 0.5em; }

  /* drag-to-cut affordance: fades in 6s after page load if the visitor
     hasn't already dragged the figure. */
  .drag-hint {
    margin: 14px auto 0;
    text-align: center;
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
    opacity: 0;
    transition: opacity 0.7s var(--ease);
    pointer-events: none;
  }
  .drag-hint.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; animation: none; }
    .cell { opacity: 1; animation: none; }
    .hg-top, .hg-bot { animation: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    .hg-bot { fill: var(--mid); }
    .hg-top { transform: translate(0, -7px); }
    .hg-bot { transform: translate(0, 7px); }
    .hg-cut { animation: none; opacity: 0.4; stroke-dashoffset: 0; }
    .hero-figure { cursor: default; }
  }
</style>
</head>
<body>
<main class="wrap wrap--home">

  <header class="hero">
    <h1 class="wordmark reveal r1">dela</h1>
    <p class="tagline reveal r2">the art of dividing.</p>

    <!-- Hero visual: 12-cell hourglass polyomino. Drag the figure vertically to cut it.
         Swap for hero.mp4 / hero.gif when delivered. -->
    <div class="hero-figure reveal r3" id="hero-figure">
      <svg viewBox="0 0 153 153" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g class="hg-top">
          <rect class="cell" x="0"   y="0"  width="36" height="36"/>
          <rect class="cell" x="39"  y="0"  width="36" height="36"/>
          <rect class="cell" x="78"  y="0"  width="36" height="36"/>
          <rect class="cell" x="117" y="0"  width="36" height="36"/>
          <rect class="cell" x="39"  y="39" width="36" height="36"/>
          <rect class="cell" x="78"  y="39" width="36" height="36"/>
        </g>
        <g class="hg-bot">
          <rect class="cell cell--bot" x="39"  y="78"  width="36" height="36"/>
          <rect class="cell cell--bot" x="78"  y="78"  width="36" height="36"/>
          <rect class="cell cell--bot" x="0"   y="117" width="36" height="36"/>
          <rect class="cell cell--bot" x="39"  y="117" width="36" height="36"/>
          <rect class="cell cell--bot" x="78"  y="117" width="36" height="36"/>
          <rect class="cell cell--bot" x="117" y="117" width="36" height="36"/>
        </g>
        <line class="hg-cut" x1="0" y1="76.5" x2="153" y2="76.5" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" pathLength="200"/>
      </svg>
    </div>

    <p class="drag-hint" aria-hidden="true">drag to cut</p>

    <div class="badge-row reveal r4">
      <!-- Coming-soon placeholder. Swap href for the live App Store URL and the badge
           graphic for Apple's official "Download on the App Store" SVG when ready. -->
      <a class="app-badge" href="/coming-soon/" aria-label="Coming soon to the App Store">
        <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
          <path d="M21.5 16.4c0-2.7 2.2-4 2.3-4-1.3-1.8-3.2-2.1-3.9-2.1-1.7-.2-3.2 1-4.1 1-.9 0-2.2-1-3.6-1-1.8 0-3.6 1.1-4.5 2.7-1.9 3.3-.5 8.2 1.4 10.9.9 1.3 2 2.8 3.5 2.7 1.4-.1 1.9-.9 3.6-.9s2.2.9 3.6.9c1.5 0 2.5-1.3 3.4-2.6 1.1-1.5 1.5-3 1.5-3-.1 0-2.9-1.1-2.9-4.6zM18.6 8.8c.7-.9 1.2-2.1 1.1-3.3-1 .1-2.3.7-3 1.6-.7.8-1.3 2-1.1 3.2 1.1.1 2.3-.6 3-1.5z" fill="currentColor"/>
        </svg>
        <span>
          <span class="top">Coming soon</span>
          <span class="bot">App Store</span>
        </span>
      </a>
    </div>

    <p class="fineprint reveal r4">
      no ads<span class="dot">·</span>no IAP<span class="dot">·</span>no cookies<span class="dot">·</span>no login<span class="dot">·</span>one price
    </p>
  </header>

  <footer class="reveal r5">
    <nav aria-label="Site">
      <a href="/privacy/">Privacy</a>
      <a href="/support/">Support</a>
      <a href="/press/">Press</a>
      <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/" rel="external">Terms</a>
    </nav>
    <span>&copy; 2026 Erik Nielsen</span>
  </footer>

</main>

<script>
/* Hero animation system.
   - Three shapes rotate on each 11s animation iteration: hourglass, plus, staircase.
   - Drag-to-cut: pointer captures pause the auto loop and let the visitor produce
     the cut themselves, with the same separation, color flip, and shadow lift.
   Cells are rebuilt as <rect>s on each shape swap so cell-reveal staggers cleanly. */
(() => {
  const figure = document.getElementById('hero-figure');
  if (!figure) return;

  const top = figure.querySelector('.hg-top');
  const bot = figure.querySelector('.hg-bot');
  const cut = figure.querySelector('.hg-cut');
  if (!top || !bot || !cut) return;

  /* Each shape: cells laid out on a 4x4 grid with cells 36 units, 3 unit gap
     (cell pitch = 39). cutY is the horizontal cut line position in viewBox units. */
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const CELL = 36, PITCH = 39;
  const shapes = [
    { /* hourglass: 4 + 2 / 2 + 4 */
      top: [[0,0],[1,0],[2,0],[3,0],[1,1],[2,1]],
      bot: [[1,2],[2,2],[0,3],[1,3],[2,3],[3,3]],
      cutY: 76.5,
    },
    { /* plus: 2 + 4 / 4 + 2 */
      top: [[1,0],[2,0],[0,1],[1,1],[2,1],[3,1]],
      bot: [[0,2],[1,2],[2,2],[3,2],[1,3],[2,3]],
      cutY: 76.5,
    },
    { /* staircase: 2 + 3 / 3 + 2 */
      top: [[0,0],[1,0],[0,1],[1,1],[2,1]],
      bot: [[1,2],[2,2],[3,2],[2,3],[3,3]],
      cutY: 76.5,
    },
  ];

  let shapeIndex = 0;

  function buildCells(g, list, isBot) {
    g.replaceChildren();
    for (const [c, r] of list) {
      const rect = document.createElementNS(SVG_NS, 'rect');
      rect.setAttribute('class', isBot ? 'cell cell--bot' : 'cell');
      rect.setAttribute('x', c * PITCH);
      rect.setAttribute('y', r * PITCH);
      rect.setAttribute('width', CELL);
      rect.setAttribute('height', CELL);
      g.appendChild(rect);
    }
  }

  function paintShape(idx) {
    const s = shapes[idx];
    buildCells(top, s.top, false);
    buildCells(bot, s.bot, true);
    cut.setAttribute('y1', s.cutY);
    cut.setAttribute('y2', s.cutY);
  }

  paintShape(0);

  /* Advance shape on each top-drift iteration boundary (start of new 11s cycle). */
  top.addEventListener('animationiteration', (e) => {
    if (e.animationName !== 'top-drift') return;
    shapeIndex = (shapeIndex + 1) % shapes.length;
    paintShape(shapeIndex);
  });

  /* Drag-to-cut. Skipped under reduced-motion so the static figure isn't disturbed. */
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    figure.style.cursor = 'default';
    figure.style.touchAction = 'auto';
  } else {
    /* Drag affordance: most visitors won't realise the figure is interactive.
       Fade in a small "drag to cut" caption after a short idle, hide it after
       any successful interaction (and persist that across visits in this tab). */
    const dragHint = document.querySelector('.drag-hint');
    let dragRevealed = false;
    try { dragRevealed = sessionStorage.getItem('dela-dragged') === '1'; } catch (_) {}
    if (dragHint && !dragRevealed) {
      setTimeout(() => { if (!dragRevealed) dragHint.classList.add('show'); }, 6000);
    }
    function markDragged() {
      dragRevealed = true;
      if (dragHint) dragHint.classList.remove('show');
      try { sessionStorage.setItem('dela-dragged', '1'); } catch (_) {}
    }

    let pointerDown = false;
    let pointerId = null;
    let startY = 0;
    let queued = null;

    function lerpFill(p) {
      /* paper -> mid via color-mix; respects light-mode overrides automatically. */
      return `color-mix(in srgb, var(--paper), var(--mid) ${p * 100}%)`;
    }

    function paint(progress) {
      const eased = Math.max(0, Math.min(1, progress));
      const offset = eased * 14;
      top.style.transform = `translate(0, ${-offset}px)`;
      bot.style.transform = `translate(0, ${offset}px)`;
      const lineProgress = Math.min(1, eased * 1.8);
      cut.style.opacity = lineProgress * 0.55;
      cut.style.strokeDashoffset = (1 - lineProgress) * 200;
      bot.style.fill = lerpFill(eased);
      const blur = 2 + eased * 8;
      const dy = 1 + eased * 5;
      const opacity = 0.22 + eased * 0.20;
      const shadow = `drop-shadow(0 ${dy}px ${blur}px rgba(0,0,0,${opacity}))`;
      top.style.filter = shadow;
      bot.style.filter = shadow;
    }

    function clearInline() {
      top.style.transform = '';
      bot.style.transform = '';
      cut.style.opacity = '';
      cut.style.strokeDashoffset = '';
      top.style.filter = '';
      bot.style.filter = '';
      bot.style.fill = '';
      /* Drop the negative animation-delay on resume so the auto cycle picks up
         cleanly from the closed state instead of jumping to mid-cut.
         top has 2 animations (drift, shadow); bot has 3 (drift, shadow, flip). */
      top.style.animationDelay = '0s, 0s';
      bot.style.animationDelay = '0s, 0s, 0s';
      cut.style.animationDelay = '0s';
      delete figure.dataset.mode;
    }

    function release() {
      figure.dataset.mode = 'manual';
      paint(1);
      queued && clearTimeout(queued);
      queued = setTimeout(() => {
        paint(0);
        queued = setTimeout(() => {
          clearInline();
          queued = null;
        }, 700);
      }, 1600);
    }

    figure.addEventListener('pointerdown', (e) => {
      pointerDown = true;
      pointerId = e.pointerId;
      if (queued) { clearTimeout(queued); queued = null; }
      figure.dataset.mode = 'manual';
      startY = e.clientY;
      paint(0);
      try { figure.setPointerCapture(e.pointerId); } catch (_) {}
      e.preventDefault();
    });

    figure.addEventListener('pointermove', (e) => {
      if (!pointerDown || e.pointerId !== pointerId) return;
      const dist = Math.abs(e.clientY - startY);
      paint(dist / 80);
    });

    function up(e) {
      if (!pointerDown || (e && e.pointerId !== pointerId)) return;
      pointerDown = false;
      pointerId = null;
      markDragged();
      release();
    }
    figure.addEventListener('pointerup', up);
    figure.addEventListener('pointercancel', up);
  }
})();

/* console */
console.log(
  '%c the art of dividing. ',
  'background:#E8E6E1;color:#131110;padding:14px 24px;font-family:serif;font-style:italic;font-size:14px;letter-spacing:0.01em;'
);
</script>
</body>
</html>
