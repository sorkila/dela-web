<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Not found · dela</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131110" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F5F4F0" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/pirata-one-latin.woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<script defer src="https://cloud.umami.is/script.js" data-website-id="6dcc31dc-88bf-40f4-b641-b362c6f1867d"></script>
<style>
  body {
    display: grid;
    place-items: center;
    min-height: 100dvh;
    text-align: center;
    padding:
      max(24px, env(safe-area-inset-top, 0px))
      max(24px, env(safe-area-inset-right, 0px))
      max(24px, env(safe-area-inset-bottom, 0px))
      max(24px, env(safe-area-inset-left, 0px));
  }
  main {
    position: relative;
    z-index: 1;
    animation: fade 0.7s var(--ease) both;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* "Didn't quite balance" — two paper bars, the right one slightly low and
     slowly oscillating. Reads as "still searching for balance" rather than
     a static drawing. */
  .unbalanced {
    width: 96px;
    height: 36px;
    margin: 0 auto 28px;
    display: flex;
    gap: 14px;
    align-items: stretch;
  }
  .unbalanced span {
    display: block;
    border-radius: 4px;
    background: var(--paper);
  }
  .unbalanced .l { flex: 1; }
  .unbalanced .r {
    flex: 0.55;
    background: var(--mid);
    transform: translateY(6px);
    animation: tip 5s ease-in-out 1.2s infinite;
  }
  @keyframes tip {
    0%, 100% { transform: translateY(6px); }
    50%      { transform: translateY(9px); }
  }

  h1 {
    font-family: 'Pirata One', serif;
    font-weight: 400;
    font-size: clamp(56px, 12vw, 96px);
    line-height: 1;
    margin: 0;
    color: var(--paper);
  }
  p { color: var(--muted); margin: 14px 0 0; font-size: 16px; }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .unbalanced .r { animation: none; }
  }
</style>
</head>
<body>
<main>
  <div class="unbalanced" aria-hidden="true"><span class="l"></span><span class="r"></span></div>
  <h1>404</h1>
  <p>nothing to divide here.</p>
  <p><a href="/">return home</a></p>
</main>
</body>
</html>
